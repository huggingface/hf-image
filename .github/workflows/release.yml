name: Release

# Publishes the helper image of the selected branch's version and uploads its pinned reference (the
# `pin` artifact). scripts/release.sh runs it on the release branch, then pins it in the release PR.
on:
  workflow_dispatch:

permissions: {}

env:
  IMAGE: cr.hf.co/infra-workloads/hf-image-helper

jobs:
  version:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)"
          helper="$(sed -n 's/^version = "\(.*\)"$/\1/p' helper/Cargo.toml | head -1)"
          if [[ "$version" != "$helper" ]]; then
            echo "::error::pyproject.toml ($version) and helper/Cargo.toml ($helper) disagree on the version"
            exit 1
          fi
          if docker buildx imagetools inspect "$IMAGE:$version" >/dev/null 2>&1; then
            echo "::error::$IMAGE:$version is already published"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - run: sudo apt-get update -q && sudo apt-get install -y -q protobuf-compiler musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }} --manifest-path helper/Cargo.toml
      # The helper image's build context: hf-image-helper-<arch>.
      - run: cp "helper/target/${{ matrix.target }}/release/hf-image-helper" "hf-image-helper-${{ matrix.arch }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helper-${{ matrix.arch }}
          path: hf-image-helper-${{ matrix.arch }}
          if-no-files-found: error

  helper-image:
    needs: [version, build]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: helper-*
          merge-multiple: true
          path: helper-context
      # Artifacts drop the executable bit.
      - run: chmod +x helper-context/hf-image-helper-*
      # The registry ignores the user name: the token is the credential.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: cr.hf.co
          username: hf
          password: ${{ secrets.HF_IMAGE_HELPER_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: helper-context
          file: helper/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.version.outputs.version }}
      - env:
          VERSION: ${{ needs.version.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          printf '%s\n' "$IMAGE:$VERSION@$DIGEST" >pin
          printf '%s\n' "Published \`$IMAGE:$VERSION@$DIGEST\`." >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pin
          path: pin
          if-no-files-found: error
